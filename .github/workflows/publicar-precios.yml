name: Publicar precios

# Flujo principal (un solo archivo): subís/actualizás el Excel de POSBerry en
# data-src/ (por la web de GitHub o git) y este Action corre la ingesta y
# commitea los JSON. Cloudflare Pages detecta el push y redepliega.
#
# También se puede disparar a mano (workflow_dispatch) o desde la planilla de
# Google (repository_dispatch) como respaldo: si las variables SHEET_*_URL están
# vacías, la ingesta lee los archivos locales de data-src/.
on:
  push:
    paths:
      - "data-src/**"
  repository_dispatch:
    types: [publicar-precios]
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos publicaciones pisándose; encolar en vez de cancelar.
concurrency:
  group: publicar-precios
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ingesta desde la planilla
        env:
          # URLs del Google Sheet publicado como CSV (una por pestaña).
          # Configurar en: Settings → Secrets and variables → Actions → Variables
          SHEET_PRODUCTOS_URL: ${{ vars.SHEET_PRODUCTOS_URL }}
          SHEET_STANDS_URL: ${{ vars.SHEET_STANDS_URL }}
          SHEET_FAMILIAS_URL: ${{ vars.SHEET_FAMILIAS_URL }}
          # Opcional: base para fotos cargadas como nombre de archivo suelto.
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: npm run ingest

      - name: Commit y push si cambiaron los datos
        run: |
          git config user.name "farmafest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data reports
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos; nada que publicar."
          else
            git commit -m "datos: actualización desde planilla ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "Publicado. Cloudflare Pages redeploya en ~1–2 min."
          fi

      - name: Resumen de la ingesta
        if: always()
        run: |
          echo "### Reporte de ingesta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat reports/ingesta-report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(sin reporte)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
