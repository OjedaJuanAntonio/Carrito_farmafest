# Config de Cloudflare Pages (sitio 100% estático).
# Cloudflare sube la carpeta out/ (el export estático de Next) tal cual, sin
# usar código de servidor. Build command: `npm run build`; output: `out`.
#
# IMPORTANTE: `name` debe coincidir EXACTO con el nombre del proyecto que
# figura en el dashboard de Cloudflare Pages. Si ahí dice otra cosa,
# cambiá esta línea para que sean idénticos.
name = "carrito-farmafest"
pages_build_output_dir = "out"
