# Despliegue del sitio estático en Cloudflare (Workers Static Assets).
#
# El build de Cloudflare corre `wrangler deploy`, que necesita saber qué subir.
# Acá le declaramos la carpeta `out/` (el export estático de Next) como assets:
# Cloudflare la sube y la sirve desde su edge, sin código de servidor.
#
# `not_found_handling = "404-page"` sirve out/404.html para rutas no existentes.
# `name` debe coincidir con el nombre del proyecto en el dashboard de Cloudflare.
name = "carrito-farmafest"
compatibility_date = "2026-09-18"

[assets]
directory = "./out"
not_found_handling = "404-page"
